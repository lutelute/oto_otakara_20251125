<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大石を探せ！宝探しクイズ</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            font-family: 'Arial', sans-serif;
            color: white;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            animation: fadeIn 1s ease-in;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: glow 3s infinite alternate;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .quest-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            animation: slideInUp 1s ease-out;
        }

        .quest-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #f1c40f;
            text-align: center;
        }

        .riddle {
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #e74c3c;
            font-style: italic;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .hint-section {
            margin: 25px 0;
        }

        .hint-title {
            font-size: 1.2rem;
            color: #f39c12;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hint-list {
            list-style: none;
            padding: 0;
        }

        .hint-list li {
            background: rgba(255,255,255,0.08);
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #3498db;
            transition: transform 0.2s ease;
        }

        .hint-list li:hover {
            transform: translateX(10px);
            background: rgba(255,255,255,0.15);
        }

        .location-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .location-card {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .location-card:hover {
            transform: translateY(-5px);
            border-color: #f1c40f;
            box-shadow: 0 10px 20px rgba(241,196,15,0.3);
        }

        .location-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }

        .location-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .location-desc {
            font-size: 0.9rem;
            opacity: 0.8;
            line-height: 1.4;
        }

        .treasure-photo {
            position: relative;
            text-align: center;
            margin: 30px 0;
            padding: 20px;
        }

        .treasure-photo img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .treasure-photo img:hover {
            transform: scale(1.05);
        }

        .photo-frame {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 3px solid #f1c40f;
            border-radius: 18px;
            pointer-events: none;
            animation: glow 3s infinite alternate;
        }

        .treasure-description {
            font-size: 1.2rem;
            text-align: center;
            margin-top: 20px;
            line-height: 1.6;
        }

        .riddle {
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #e74c3c;
            font-style: italic;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .hint-section {
            margin: 25px 0;
        }

        .hint-title {
            font-size: 1.2rem;
            color: #f39c12;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .emoji-decoration {
            font-size: 1.5rem;
            margin: 0 10px;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes slideInUp {
            0% {
                transform: translateY(50px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes glow {
            0% {
                text-shadow: 2px 2px 4px rgba(0,0,0,0.5), 0 0 20px rgba(255,255,255,0.3);
            }
            100% {
                text-shadow: 2px 2px 4px rgba(0,0,0,0.5), 0 0 30px rgba(241,196,15,0.6);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(231,76,60,0.5);
            }
            50% {
                transform: scale(1.02);
                box-shadow: 0 0 30px rgba(231,76,60,0.8);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(231,76,60,0.5);
            }
        }

        .interactive-element {
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .interactive-element:hover {
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .title {
                font-size: 2rem;
            }
            
            .quest-card {
                padding: 20px;
            }
            
            .location-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">💎 シマエナガが守るお宝 💎</h1>
            <p class="subtitle">白い小鳥が大切に守っている宝物を見つけよう！</p>
        </div>

        <div class="quest-card">
            <h2 class="quest-title">🎯 探している宝物 🎯</h2>
            <div class="treasure-photo">
                <img src="otakara_light.jpg" alt="宝物の写真" id="treasureImage">
                <div class="photo-frame"></div>
            </div>
            <p class="treasure-description">写真をよく見て、この宝物を探し出してください！</p>
        </div>

        <div class="quest-card">
            <h2 class="quest-title">🐧 謎解き 🐧</h2>
            <div class="riddle">
                「北の大地の白い妖精、<br>
                丸い体に真っ黒な瞳、<br>
                子の愛で作られし温かな巣、<br>
                そこに眠る宝を探し給え。」
            </div>
        </div>
    </div>

    <script>
        // 宝物画像クリック時のエフェクト
        document.getElementById('treasureImage').addEventListener('click', () => {
            showMessage("📸 写真をよく見て、この宝物を探してね！", "#e67e22");
            playClickSound();
        });
        
        function showMessage(message, color) {
            const feedback = document.createElement('div');
            feedback.innerHTML = message;
            feedback.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: ${color};
                color: white;
                padding: 15px 25px;
                border-radius: 25px;
                font-size: 1.1rem;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                z-index: 1000;
                animation: slideDown 0.5s ease-out;
            `;
            
            document.body.appendChild(feedback);
            
            setTimeout(() => {
                feedback.remove();
            }, 3000);
        }
        
        function playClickSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }
        
        // ページロード時のアニメーション
        window.addEventListener('load', () => {
            const cards = document.querySelectorAll('.quest-card');
            cards.forEach((card, index) => {
                card.style.animationDelay = `${index * 0.2}s`;
            });
        });
        
        // 追加のCSS for slideDown animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideDown {
                0% {
                    transform: translateX(-50%) translateY(-100%);
                    opacity: 0;
                }
                100% {
                    transform: translateX(-50%) translateY(0);
                    opacity: 1;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
