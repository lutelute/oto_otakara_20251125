<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お宝発見！おめでとう！</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            color: white;
            z-index: 2;
            position: relative;
        }

        .treasure-box {
            width: 150px;
            height: 100px;
            background: #DAA520;
            border: 3px solid #B8860B;
            border-radius: 10px;
            margin: 0 auto 30px;
            position: relative;
            animation: bounce 2s infinite;
        }

        .treasure-box::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 20px;
            right: 20px;
            height: 20px;
            background: #8B4513;
            border-radius: 5px 5px 0 0;
        }

        .treasure-box::after {
            content: '💎';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            animation: sparkle 1.5s infinite;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: glow 2s infinite alternate;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .congratulations {
            font-size: 1.5rem;
            margin-bottom: 30px;
            animation: fadeInUp 1s ease-out;
        }

        .celebration {
            font-size: 2rem;
            margin: 20px 0;
            animation: pulse 1s infinite;
        }

        .fireworks {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .firework {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: explode 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-30px);
            }
            60% {
                transform: translateY(-15px);
            }
        }

        @keyframes sparkle {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.8;
            }
        }

        @keyframes glow {
            0% {
                text-shadow: 2px 2px 4px rgba(0,0,0,0.3), 0 0 20px rgba(255,255,255,0.5);
            }
            100% {
                text-shadow: 2px 2px 4px rgba(0,0,0,0.3), 0 0 30px rgba(255,255,255,0.8);
            }
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes explode {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            50% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        .success-message {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            margin-top: 30px;
            animation: slideIn 1.5s ease-out;
        }

        @keyframes slideIn {
            0% {
                transform: translateX(-100%);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="fireworks" id="fireworks"></div>
    
    <div class="container">
        <div class="treasure-box"></div>
        <h1>🎉 お宝発見！ 🎉</h1>
        <div class="congratulations">
            おめでとうございます！<br>
            あなたは見事にお宝を見つけました！
        </div>
        <div class="celebration">
            ✨ 素晴らしい探索でした ✨
        </div>
        <div class="success-message">
            <p>🏆 宝探しクリア！ 🏆</p>
            <p>あなたの冒険心と推理力が実を結びました。</p>
        </div>
    </div>

    <script>
        function createFirework() {
            const fireworksContainer = document.getElementById('fireworks');
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD'];
            
            for (let i = 0; i < 15; i++) {
                const firework = document.createElement('div');
                firework.className = 'firework';
                firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                firework.style.left = Math.random() * 100 + '%';
                firework.style.top = Math.random() * 100 + '%';
                firework.style.animationDelay = Math.random() * 2 + 's';
                fireworksContainer.appendChild(firework);
                
                setTimeout(() => {
                    firework.remove();
                }, 3000);
            }
        }

        function playSuccessSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            function playTone(frequency, duration, delay = 0) {
                setTimeout(() => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + duration);
                }, delay);
            }
            
            // 成功音のメロディー
            playTone(523, 0.2, 0);    // C
            playTone(659, 0.2, 200);  // E
            playTone(784, 0.2, 400);  // G
            playTone(1047, 0.4, 600); // C (高)
        }

        // ページ読み込み時のアニメーション
        window.addEventListener('load', () => {
            createFirework();
            playSuccessSound();
            
            // 定期的に花火を追加
            setInterval(createFirework, 3000);
        });

        // クリック時に追加の花火
        document.addEventListener('click', () => {
            createFirework();
            playSuccessSound();
        });
    </script>
</body>
</html>
